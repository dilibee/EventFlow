<!DOCTYPE html>
<html>

<head>

    <title>EventFlow | Event Check-In</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            EventFlow
        </div>

        <h1>Event Check-In</h1>

        <p>
            Scan a guest's ticket to check them in.
        </p>

    </header>


    <main>

        <div class="scanner-card">

            <div id="reader"></div>

        </div>


        <div id="status">
            Ready to scan...
        </div>

    </main>


    <footer>

        <span class="status-dot"></span>

        System Online

    </footer>

</div>


<!-- Full Screen Result -->

<div id="resultOverlay">

    <div id="resultBox">

        <h1 id="resultTitle"></h1>

        <p id="resultName"></p>

    </div>

</div>


<script src="scanner.js"></script>

</body>

</html>
