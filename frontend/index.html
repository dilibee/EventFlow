<!DOCTYPE html>
<html>

<head>
    <title>EventFlow | Event Check-In</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css?v=7">

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>


<body>

<div class="app">


    <!-- EventFlow Brand -->
    <header class="top-header">

        <div class="brand-box">
            EVENTFLOW
        </div>

        <h1 id="eventTitle">
            EventFlow Demo Event
        </h1>

        <h2>
            Event Check-In
        </h2>

    </header>



    <!-- =========================
         SCAN VIEW
         ========================= -->

    <main id="scanView" class="view active-view">

        <p class="instructions">
            Position the QR code inside the frame.
        </p>


        <div class="scanner-section">

            <div class="scanner-card">

                <div class="scanner-frame">

                    <span class="corner top-left"></span>
                    <span class="corner top-right"></span>
                    <span class="corner bottom-left"></span>
                    <span class="corner bottom-right"></span>

                    <div id="reader"></div>

                </div>

            </div>


            <div id="status">
                Starting camera...
            </div>


            <div
                id="connectionStatus"
                class="connection-status"
            >

                <span class="connection-dot"></span>

                <span id="connectionText">
                    Connecting...
                </span>

            </div>

        </div>

    </main>



    <!-- =========================
         SEARCH VIEW
         ========================= -->

    <main id="searchView" class="view">

        <div class="search-container">

            <h2>
                Search Guest
            </h2>

            <p class="search-description">
                Find a guest by name and check them in manually.
            </p>


            <div class="search-box">

                <input
                    type="text"
                    id="guestSearchInput"
                    placeholder="Enter guest name..."
                    autocomplete="off"
                >

                <button
                    id="guestSearchButton"
                    type="button"
                >
                    Search
                </button>

            </div>


            <div id="searchStatus"></div>


            <div id="searchResults">

                <!-- Search results will appear here later -->

            </div>

        </div>

    </main>



    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <button
            id="scanNav"
            class="nav-button active"
            type="button"
        >
            <span class="nav-icon">▣</span>
            <span>Scan</span>
        </button>


        <button
            id="searchNav"
            class="nav-button"
            type="button"
        >
            <span class="nav-icon">⌕</span>
            <span>Search</span>
        </button>

    </nav>


</div>



<!-- =========================
     RESULT OVERLAY
     ========================= -->

<div id="resultOverlay">

    <div id="resultCard">

        <div id="resultIcon"></div>

        <h1 id="resultTitle"></h1>

        <p id="resultTicket"></p>

        <h2 id="resultName"></h2>

        <p id="resultDetails"></p>

    </div>

</div>



<script src="scanner.js?v=7"></script>

</body>

</html>
